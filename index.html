<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YashXchi | Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      line-height: 1.6;
      cursor: none; /* Normal cursor hide */
    }

    /* Cute Cat Custom Cursor */
    .cursor {
      position: fixed;
      width: 30px;
      height: 30px;
      background: url('https://cdn-icons-png.flaticon.com/512/220/220223.png') no-repeat center;
      background-size: contain;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.1s ease;
      mix-blend-mode: difference;
    }

    .cursor.hover {
      transform: scale(1.4);
      filter: hue-rotate(30deg);
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #1a1a2e, #0f0f0f);
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
   
    h1 { font-size: 3.8rem; margin-bottom: 15px; }
    p { font-size: 1.5rem; margin-bottom: 30px; color: #cccccc; }
   
    .btn {
      display: inline-block;
      padding: 14px 35px;
      background: #00ff9d;
      color: black;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      margin: 10px;
    }

    nav a {
      color: white;
      margin: 0 20px;
      text-decoration: none;
      font-size: 1.1rem;
    }
    nav a:hover { color: #00ff9d; }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="aboutme.html">About Me</a>
    <a href="projects.html">Projects</a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Hi, I'm <span style="color:#00ff9d;">YASHXCHI</span></h1>
      <p>Aspiring Full Stack Developer | BCA Student</p>
      <a href="projects.html" class="btn">See My Projects</a>
      <a href="aboutme.html" class="btn" style="background:#333; color:white;">About Me</a>
    </div>
  </section>

  <script>
    const cursor = document.getElementById('cursor');

    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // Hover effect on cards and buttons
    const hoverElements = document.querySelectorAll('a, .project, button, .btn');
    
    hoverElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
      });
    });
  </script>

</body>
</html>
